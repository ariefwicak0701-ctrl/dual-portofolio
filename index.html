<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portofolio Duo: Blackhole & Cosmic</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>

<!-- LANDING -->
<section id="landing" class="scene on">
 <div class="half hb"><span class="lab">BLACKHOLE</span>
  <button class="orbwrap" onclick="enterBlackhole()" aria-label="Buka profil Blackhole"><div class="bhole"><i class="g"></i><i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="core"></i></div><span class="nm" id="n1"></span></button></div>
 <div class="half hc"><span class="lab">COSMIC</span>
  <button class="orbwrap" onclick="enterCosmic()" aria-label="Buka profil Cosmic"><div class="planet"><i class="o"></i><i class="o b"></i></div><span class="nm" id="n2"></span></button></div>
 <canvas id="L"></canvas><div class="div"></div><div class="hint">PILIH SATU ORB</div>
</section>

<!-- PROFIL BLACKHOLE -->
<section id="bh" class="scene bh">
 <canvas id="B"></canvas>
 <div class="big" id="bigB"><div class="bhole"><i class="g"></i><i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="core"></i></div></div>
 <div class="prof"><div class="tx" id="txB"></div></div>
</section>

<!-- PROFIL COSMIC -->
<section id="cs" class="scene cs">
 <canvas id="C"></canvas>
 <div class="big" id="bigC"><div class="neb"></div><div class="planet"><i class="o"></i><i class="o b"></i></div></div>
 <div class="prof"><div class="tx" id="txC"></div></div>
</section>

<div class="nav" id="nav"><button onclick="goHome()">⌂ Home</button><button id="sw" onclick="doSwitch()">⇄ Switch</button></div>
<div id="sing"><div class="bhole fast"><i class="g"></i><i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="core"></i></div></div>
<canvas id="fx"></canvas><div id="flash"></div>

<script src="script.js"></script></body></html>
